<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" width="1200" height="270" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">How I deliver infrastructure</title>
  <desc id="d">Five stages: write Terraform code, scan it for security issues, run it through CI/CD pipelines, deploy to Azure, and observe with Azure Monitor.</desc>
  <style>
    text{font-family:"Segoe UI",Inter,-apple-system,"Helvetica Neue",Arial,sans-serif}
    .flow{stroke-dasharray:6 6;animation:dash 1.2s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-12}}
    @media (prefers-reduced-motion:reduce){.flow{animation:none}}
  </style>
  <rect width="1200" height="270" rx="20" fill="#0A2342"/>
  <text x="48" y="52" font-size="24" font-weight="700" fill="#FFFFFF">Code to cloud, with security checks built in</text>

  <line class="flow" x1="48" y1="152" x2="1152" y2="152" stroke="#3E7CB1" stroke-width="2"/>

  <g fill="#0F2A47" stroke="#3E7CB1" stroke-width="1.5">
    <rect x="48" y="90" width="196" height="136" rx="14"/>
    <rect x="276" y="90" width="196" height="136" rx="14" stroke="#F5B94B" stroke-width="2"/>
    <rect x="504" y="90" width="196" height="136" rx="14"/>
    <rect x="732" y="90" width="196" height="136" rx="14"/>
    <rect x="960" y="90" width="192" height="136" rx="14"/>
  </g>
  <g fill="#6FD6FF">
    <circle cx="76" cy="118" r="13"/><circle cx="304" cy="118" r="13" fill="#F5B94B"/>
    <circle cx="532" cy="118" r="13"/><circle cx="760" cy="118" r="13"/><circle cx="988" cy="118" r="13"/>
  </g>
  <g font-size="14" font-weight="700" fill="#0A2342" text-anchor="middle">
    <text x="76" y="123">1</text><text x="304" y="123">2</text><text x="532" y="123">3</text><text x="760" y="123">4</text><text x="988" y="123">5</text>
  </g>
  <g font-size="19" font-weight="700" fill="#FFFFFF">
    <text x="98" y="124">Write</text><text x="326" y="124">Scan</text><text x="554" y="124">Pipeline</text><text x="782" y="124">Deploy</text><text x="1010" y="124">Observe</text>
  </g>
  <g font-size="14" fill="#C7DDF0">
    <text x="68" y="166">Terraform modules,</text><text x="68" y="187">Bicep, ARM templates</text>
    <text x="296" y="166">Tfsec, TFLint, Checkov,</text><text x="296" y="187">Gitleaks</text>
    <text x="524" y="166">Azure DevOps YAML,</text><text x="524" y="187">GitHub Actions</text>
    <text x="752" y="166">VNet, AKS, App Service,</text><text x="752" y="187">Key Vault, RBAC, Policy</text>
    <text x="980" y="166">Azure Monitor,</text><text x="980" y="187">Log Analytics, alerts</text>
  </g>
</svg>
