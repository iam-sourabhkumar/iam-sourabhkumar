<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Sourabh Kumar, DevOps Engineer</title>
  <desc id="d">Banner showing a delivery flow from Git push to security scan to Terraform apply into an Azure landing zone with VNet, App Service, AKS and Key Vault.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A2342"/>
      <stop offset="1" stop-color="#11487A"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#6FD6FF" fill-opacity="0.14"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1 L9 5 L0 9 z" fill="#6FD6FF"/>
    </marker>
  </defs>
  <style>
    text{font-family:"Segoe UI",Inter,-apple-system,"Helvetica Neue",Arial,sans-serif}
    .flow{stroke-dasharray:6 6;animation:dash 1.2s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-12}}
    @media (prefers-reduced-motion:reduce){.flow{animation:none}}
  </style>
  <rect width="1200" height="340" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="20" fill="url(#dots)"/>

  <!-- left: identity -->
  <text x="70" y="82" font-size="16" fill="#8FB4D3">Bangalore, India</text>
  <text x="70" y="146" font-size="62" font-weight="700" fill="#FFFFFF" letter-spacing="-1">Sourabh Kumar</text>
  <text x="70" y="192" font-size="30" font-weight="600" fill="#6FD6FF">DevOps Engineer</text>
  <text x="70" y="230" font-size="18" fill="#C7DDF0">Secure, repeatable cloud infrastructure, delivered as code.</text>
  <g font-size="14" fill="#E6F3FF" text-anchor="middle">
    <rect x="70" y="252" width="76" height="32" rx="16" fill="none" stroke="#6FD6FF"/><text x="108" y="273">Azure</text>
    <rect x="156" y="252" width="104" height="32" rx="16" fill="none" stroke="#6FD6FF"/><text x="208" y="273">Terraform</text>
    <rect x="270" y="252" width="76" height="32" rx="16" fill="none" stroke="#6FD6FF"/><text x="308" y="273">CI/CD</text>
    <rect x="356" y="252" width="110" height="32" rx="16" fill="none" stroke="#6FD6FF"/><text x="411" y="273">DevSecOps</text>
  </g>

  <!-- right: delivery flow -->
  <g fill="#0E2F52" stroke="#3E7CB1" stroke-width="1.5">
    <rect x="700" y="60" width="112" height="48" rx="10"/>
    <rect x="856" y="60" width="112" height="48" rx="10"/>
    <rect x="1012" y="60" width="112" height="48" rx="10" stroke="#F5B94B" stroke-width="2"/>
  </g>
  <g font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">
    <text x="756" y="89">Git push</text>
    <text x="912" y="89">Scan</text>
    <text x="1068" y="89">Apply</text>
  </g>
  <g stroke="#6FD6FF" stroke-width="2" fill="none" class="flow">
    <line x1="812" y1="84" x2="854" y2="84" marker-end="url(#ar)"/>
    <line x1="968" y1="84" x2="1010" y2="84" marker-end="url(#ar)"/>
    <line x1="1068" y1="108" x2="1068" y2="158" marker-end="url(#ar)"/>
  </g>

  <rect x="700" y="162" width="424" height="132" rx="16" fill="#0A2342" fill-opacity="0.35" stroke="#6FD6FF" stroke-opacity="0.55" stroke-dasharray="5 5"/>
  <text x="720" y="188" font-size="13" fill="#8FB4D3">Azure landing zone</text>
  <g fill="#0E2F52" stroke="#3E7CB1" stroke-width="1.5">
    <rect x="718" y="204" width="92" height="42" rx="8"/>
    <rect x="820" y="204" width="92" height="42" rx="8"/>
    <rect x="922" y="204" width="92" height="42" rx="8"/>
    <rect x="1024" y="204" width="92" height="42" rx="8"/>
  </g>
  <g font-size="14" fill="#FFFFFF" text-anchor="middle">
    <text x="764" y="230">VNet</text>
    <text x="866" y="230">App Service</text>
    <text x="968" y="230">AKS</text>
    <text x="1070" y="230">Key Vault</text>
  </g>
  <text x="720" y="278" font-size="13" fill="#8FB4D3">Observed with Azure Monitor and Log Analytics</text>
</svg>
